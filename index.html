<meta charset="utf-8">
<title>엄마 몰래 게임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: a single portrait game screen. The room scene fills the frame; HUD floats over the top, the hide button sits under the right thumb. */
:root{
  color-scheme:dark;
  --bg:#15122E;
  --line:#2B2340;
  --panel:rgba(27,22,60,.84);
  --gold:#FFC83D;
  --gold-hi:#FFE48A;
  --gold-lo:#E39A00;
  --green:#3DDC84;
  --red:#FF4D5E;
  --amber:#FFB020;
  --white:#FFFFFF;
  --wall:#E3EAF4;
  --skin:#F6CDA8;
  --shorts:#5A34A6;
  --teal:#2DB7B0;
  --font-logo:'Black Han Sans','Jua',system-ui,sans-serif;
  --font-ui:'Jua',system-ui,sans-serif;
}
html,body{height:100%}
body{
  box-sizing:border-box;margin:0;background:var(--bg);color:var(--white);font-family:var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.game{position:relative;height:100%;max-width:460px;margin:0 auto;border-radius:26px;overflow:hidden;background:var(--wall);
  box-shadow:0 0 0 4px var(--line),0 24px 60px rgba(0,0,0,.55);touch-action:manipulation}
.game>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.game.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-8px,4px)}35%{transform:translate(7px,-5px)}55%{transform:translate(-5px,3px)}75%{transform:translate(4px,-2px)}}

/* danger vignette */
.vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(255,40,70,.6) 100%)}
.game[data-alert="warn"] .vig{opacity:.7;animation:pulse .45s ease-in-out infinite alternate}
.game[data-alert="danger"] .vig{opacity:1}
.game[data-mode="caught"] .vig{opacity:1;background:radial-gradient(ellipse at center,rgba(255,40,70,.18) 30%,rgba(255,40,70,.7) 100%)}
@keyframes pulse{from{opacity:.35}to{opacity:.85}}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:12px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px}
.panel{background:var(--panel);border:2.5px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.25)}
.hearts{display:flex;gap:2px;padding:6px 8px}
.hearts svg{width:22px;height:22px;display:block;transition:transform .25s,opacity .25s}
.hearts svg.off{opacity:.25;transform:scale(.75)}
.gauge{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:6px 10px}
.gauge svg{width:20px;height:20px;flex:none}
.bar{flex:1;min-width:0;height:14px;border-radius:99px;background:rgba(0,0,0,.45);border:2px solid var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));transition:width .12s linear}
.bar i::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}
.gauge b{font-weight:400;font-size:16px;min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
.timer{--p:1;width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;border:2.5px solid var(--line);
  background:conic-gradient(var(--gold) calc(var(--p)*1turn),rgba(255,255,255,.14) 0)}
.timer span{width:36px;height:36px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.timer.low{background:conic-gradient(var(--red) calc(var(--p)*1turn),rgba(255,255,255,.14) 0)}
.timer.low span{color:#FF9AA4}
.snd{pointer-events:auto;width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--white);cursor:pointer;padding:0}
.snd svg{width:20px;height:20px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;font-size:14px;border-radius:99px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.chip[data-s="warn"] .dot{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink .3s infinite alternate}
.chip[data-s="here"] .dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:blink .15s infinite alternate}
@keyframes blink{to{opacity:.3}}
.lvl{font-size:13px;padding:5px 10px;border-radius:99px;color:var(--gold);margin-left:auto}

/* hide button */
.hide-btn{position:absolute;z-index:6;right:max(14px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));
  width:112px;height:112px;border-radius:50%;border:4px solid var(--line);cursor:pointer;padding:0;color:var(--line);
  background:radial-gradient(circle at 50% 28%,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  box-shadow:0 7px 0 var(--line),inset 0 -6px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--font-ui);font-size:20px;touch-action:none;transition:transform .05s,box-shadow .05s}
.hide-btn svg{width:40px;height:40px}
.hide-btn.down{transform:translateY(6px) scale(.96);box-shadow:0 1px 0 var(--line),inset 0 4px 0 rgba(0,0,0,.12);filter:brightness(.95)}
.hide-btn:focus-visible,.snd:focus-visible,.cta:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.key{position:absolute;z-index:6;right:calc(max(14px,env(safe-area-inset-right,0px)) + 18px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 124px);
  font-size:12px;color:var(--white);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:2px 8px;pointer-events:none;display:none}
@media (hover:hover) and (pointer:fine){.key{display:block}}
.game[data-mode="title"] .hide-btn,.game[data-mode="over"] .hide-btn,.game[data-mode="title"] .key,.game[data-mode="over"] .key{visibility:hidden}

/* banner + pops */
.banner{position:absolute;left:0;right:0;top:40%;z-index:7;text-align:center;pointer-events:none;opacity:0;
  font-family:var(--font-logo);font-size:54px;line-height:1;color:var(--gold);
  text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),3px 3px 0 var(--line),-3px 3px 0 var(--line),3px -3px 0 var(--line),-3px -3px 0 var(--line),0 8px 0 var(--line)}
.banner.good{color:var(--green)}
.banner.bad{color:var(--red)}
.banner.go{animation:bannerIn 1.1s ease-out forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(.3)}14%{opacity:1;transform:scale(1.18)}24%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06) translateY(-14px)}}
.pop{position:absolute;z-index:7;pointer-events:none;font-family:var(--font-logo);font-size:26px;color:var(--gold);transform:translateX(-50%);white-space:nowrap;
  text-shadow:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line),0 4px 0 var(--line);animation:pop .8s ease-out forwards}
.pop.bad{color:var(--red)}
.pop.good{color:var(--green)}
@keyframes pop{0%{opacity:1;margin-top:0;scale:.6}20%{scale:1.15}100%{opacity:0;margin-top:-70px;scale:1}}

/* overlay screens */
.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:24px 20px 28px;
  background:linear-gradient(180deg,rgba(21,18,46,.25) 0%,rgba(21,18,46,.82) 45%,rgba(21,18,46,.96) 100%)}
.overlay[hidden]{display:none}
.logo{margin:0;font-family:var(--font-logo);font-weight:400;font-size:clamp(46px,14vw,62px);line-height:.98;color:var(--gold);transform:rotate(-3deg);text-wrap:balance;
  text-shadow:4px 0 0 var(--line),-4px 0 0 var(--line),0 4px 0 var(--line),0 -4px 0 var(--line),4px 4px 0 var(--line),-4px 4px 0 var(--line),4px -4px 0 var(--line),-4px -4px 0 var(--line),0 10px 0 var(--line)}
.logo.bad{color:var(--red)}
.logo.good{color:var(--green)}
.tag{align-self:flex-start;font-size:15px;background:var(--red);color:var(--white);border:2.5px solid var(--line);border-radius:99px;padding:4px 12px;transform:rotate(-3deg);margin-top:-6px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;line-height:1.3;min-width:0}
.step svg{width:38px;height:38px}
.step em{font-style:normal;color:var(--gold);font-size:12px}
.sub{margin:0;font-size:15px;line-height:1.45;color:#D7D2F5}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:54px;height:54px}
.stars svg.on{animation:starIn .45s backwards}
.stars svg:nth-child(2).on{animation-delay:.15s}
.stars svg:nth-child(3).on{animation-delay:.3s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{padding:8px 6px;text-align:center;font-size:12px;color:#CFC9F2}
.stats b{display:block;font-weight:400;font-size:24px;color:var(--white);font-variant-numeric:tabular-nums}
.cta{width:100%;border:4px solid var(--line);border-radius:18px;cursor:pointer;padding:14px 16px;font-family:var(--font-logo);font-size:28px;color:var(--line);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));box-shadow:0 7px 0 var(--line),inset 0 2px 0 rgba(255,255,255,.6)}
.cta:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.best{margin:-6px 0 0;text-align:center;font-size:13px;color:#A9A2D6}

/* scene states */
.f{display:none}
.game[data-face="play"] .fp,.game[data-face="alarm"] .fa,.game[data-face="study"] .fs,.game[data-face="caught"] .fc{display:block}
#tablet{transform-origin:200px 545px;transition:transform .11s ease-out,opacity .09s}
#tablet.bump{animation:bump .12s}
@keyframes bump{50%{transform:scale(1.035)}}
.game[data-hide="1"] #tablet,.game[data-mode="caught"] #tablet{transform:translateY(70px) scale(.88);opacity:0}
#handsPlay{transition:opacity .09s}
.game[data-hide="1"] #handsPlay,.game[data-mode="caught"] #handsPlay{opacity:0}
#book{transition:transform .11s ease-out}
.game[data-hide="1"] #book{transform:translateY(-64px)}
#handsStudy{opacity:0;transition:opacity .09s}
.game[data-hide="1"] #handsStudy{opacity:1}
#leaf{transform-origin:222px 0;transition:transform .13s ease-out}
.game[data-door="1"] #leaf{transform:scaleX(.14)}
#mom{opacity:0;transition:opacity .08s}
.game[data-door="1"] #mom{opacity:1}
#shadow{opacity:0;filter:blur(3.5px)}
.game[data-mom="warn"] #shadow{opacity:.7}
#handle{transform-box:fill-box;transform-origin:50% 20%}
.game[data-mom="warn"] #handle{animation:jig .16s infinite alternate}
@keyframes jig{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.mm{display:none}
.game[data-mood="calm"] .mc,.game[data-mood="sus"] .ms,.game[data-mood="angry"] .ma{display:block}
#bubble{opacity:0;transition:opacity .1s}
.game[data-bubble="1"] #bubble{opacity:1}
#alertMark{opacity:0}
.game[data-face="alarm"] #alertMark{opacity:1;animation:hop .3s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-6px)}}
.sweat{display:none}
.game[data-face="alarm"] .sweat{display:block}
#tapHint{opacity:0;pointer-events:none}
.game[data-tap="1"] #tapHint{opacity:1}
#tapHint circle{transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
.snow circle{animation:fall 2.4s linear infinite}
.snow circle:nth-child(2){animation-delay:-.8s;animation-duration:2.9s}
.snow circle:nth-child(3){animation-delay:-1.6s;animation-duration:2.1s}
.snow circle:nth-child(4){animation-delay:-2.1s}
.snow circle:nth-child(5){animation-delay:-1.2s;animation-duration:2.6s}
@keyframes fall{from{transform:translateY(-6px)}to{transform:translateY(96px)}}
.lights circle{animation:twinkle 1s steps(2) infinite}
.lights circle:nth-child(2n){animation-delay:-.5s}
@keyframes twinkle{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.game.shake,.vig,.snow circle,.lights circle,#alertMark,#tapHint circle{animation:none!important}}
</style>

<div class="game" id="game" data-mode="title" data-mom="away" data-hide="0" data-mood="calm" data-face="play" data-door="0" data-bubble="0" data-alert="none" data-tap="0">
  <svg viewBox="0 0 400 640" preserveAspectRatio="xMidYMax meet" role="img" aria-label="소파에 앉아 태블릿 게임을 하는 아이, 뒤쪽에 파란 문이 있는 거실">
    <defs>
      <linearGradient id="wallG" gradientUnits="userSpaceOnUse" x1="0" y1="-200" x2="0" y2="432"><stop offset="0" stop-color="#D5DEEC"/><stop offset="1" stop-color="#EEF2F8"/></linearGradient>
      <linearGradient id="floorG" gradientUnits="userSpaceOnUse" x1="0" y1="432" x2="0" y2="660"><stop offset="0" stop-color="#C99D6C"/><stop offset="1" stop-color="#A97A4B"/></linearGradient>
      <radialGradient id="lampG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE6A8" stop-opacity=".7"/><stop offset="1" stop-color="#FFE6A8" stop-opacity="0"/></radialGradient>
      <linearGradient id="doorG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A47C4"/><stop offset="1" stop-color="#1C2C96"/></linearGradient>
      <linearGradient id="frostG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#B4D0E2"/></linearGradient>
      <linearGradient id="hallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9B8"/><stop offset=".55" stop-color="#E7C890"/><stop offset="1" stop-color="#9C7A55"/></linearGradient>
      <linearGradient id="sofaBackG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDE4D2"/><stop offset="1" stop-color="#D3C5A9"/></linearGradient>
      <linearGradient id="sofaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F3E9"/><stop offset="1" stop-color="#E4D9C4"/></linearGradient>
      <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCEB98"/><stop offset="1" stop-color="#EFCF5C"/></linearGradient>
      <linearGradient id="screenG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A6B"/><stop offset="1" stop-color="#2D1B5A"/></linearGradient>
      <clipPath id="glassClip"><rect x="238" y="154" width="94" height="118" rx="5"/></clipPath>
      <clipPath id="screenClip"><rect x="121" y="499" width="158" height="90" rx="6"/></clipPath>
    </defs>

    <!-- room -->
    <rect x="-600" y="-800" width="1600" height="1232" fill="url(#wallG)"/>
    <ellipse cx="90" cy="70" rx="220" ry="180" fill="url(#lampG)"/>
    <rect x="-600" y="420" width="1600" height="14" fill="#FAFBFD" stroke="#C9D2E2" stroke-width="2"/>
    <rect x="-600" y="433" width="1600" height="400" fill="url(#floorG)"/>
    <g stroke="#9A6E43" stroke-width="2" opacity=".55" fill="none">
      <path d="M-600 470H1000M-600 520H1000"/>
      <path d="M40 433V470M180 470V520M330 433V470M90 520V560M270 520V560"/>
    </g>

    <!-- calendar -->
    <g transform="rotate(-2 66 150)">
      <rect x="22" y="96" width="92" height="112" rx="5" fill="#fff" stroke="var(--line)" stroke-width="2.5"/>
      <rect x="22" y="96" width="92" height="24" rx="5" fill="#3E63D6" stroke="var(--line)" stroke-width="2.5"/>
      <text x="68" y="114" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="14" fill="#fff">10월</text>
      <g font-family="Jua, sans-serif" font-size="9" fill="#3a3550" text-anchor="middle">
        <text x="34" y="138" fill="#E5484D">4</text><text x="46" y="138">5</text><text x="58" y="138">6</text><text x="70" y="138">7</text><text x="82" y="138">8</text><text x="94" y="138">9</text><text x="105" y="138">10</text>
        <text x="34" y="154" fill="#E5484D">11</text><text x="46" y="154">12</text><text x="58" y="154">13</text><text x="70" y="154">14</text><text x="82" y="154">15</text><text x="94" y="154">16</text><text x="105" y="154">17</text>
        <text x="34" y="170" fill="#E5484D">18</text><text x="46" y="170">19</text><text x="58" y="170">20</text><text x="70" y="170">21</text><text x="82" y="170">22</text><text x="94" y="170">23</text><text x="105" y="170">24</text>
        <text x="34" y="186" fill="#E5484D">25</text><text x="46" y="186">26</text><text x="58" y="186">27</text><text x="70" y="186">28</text><text x="82" y="186">29</text><text x="94" y="186">30</text><text x="105" y="186">31</text>
      </g>
      <circle cx="46" cy="183" r="7" fill="none" stroke="#E5484D" stroke-width="1.8"/>
    </g>

    <!-- door -->
    <rect x="210" y="126" width="150" height="308" rx="3" fill="#152274" stroke="var(--line)" stroke-width="3"/>
    <rect x="222" y="138" width="126" height="296" fill="url(#hallG)"/>
    <g id="mom">
      <path d="M240 434L246 320Q285 298 324 320L330 434Z" fill="#E8647A" stroke="var(--line)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M262 342H308V434H262Z" fill="#FFF1EC" stroke="var(--line)" stroke-width="2.5"/>
      <rect x="244" y="350" width="82" height="24" rx="12" fill="var(--skin)" stroke="var(--line)" stroke-width="2.5"/>
      <rect x="274" y="288" width="22" height="22" fill="var(--skin)" stroke="var(--line)" stroke-width="2.5"/>
      <circle cx="285" cy="220" r="16" fill="#2B1B17" stroke="var(--line)" stroke-width="2.5"/>
      <circle cx="285" cy="260" r="35" fill="var(--skin)" stroke="var(--line)" stroke-width="3"/>
      <path d="M250 264Q246 222 285 224Q324 222 320 264Q312 238 285 240Q258 238 250 264Z" fill="#2B1B17" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="266" cy="276" r="6" fill="#FF8A80" opacity=".35"/><circle cx="304" cy="276" r="6" fill="#FF8A80" opacity=".35"/>
      <g class="mm mc">
        <path d="M268 262Q274 257 280 262M290 262Q296 257 302 262" stroke="#2B1B17" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M274 280Q285 291 296 280" stroke="#2B1B17" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <g class="mm ms">
        <path d="M266 252L281 256M304 252L289 256" stroke="#2B1B17" stroke-width="3" stroke-linecap="round"/>
        <path d="M268 264H280M290 264H302" stroke="#2B1B17" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M277 284H293" stroke="#2B1B17" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g class="mm ma">
        <path d="M264 248L282 256M306 248L288 256" stroke="#2B1B17" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="274" cy="264" r="3.6" fill="#2B1B17"/><circle cx="296" cy="264" r="3.6" fill="#2B1B17"/>
        <path d="M273 288Q285 276 297 288Z" fill="#7a2f2f" stroke="#2B1B17" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M306 228l8 8M314 228l-8 8M310 226v12M304 232h12" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
    <g id="leaf">
      <rect x="222" y="138" width="126" height="296" fill="url(#doorG)" stroke="var(--line)" stroke-width="2.5"/>
      <rect x="238" y="154" width="94" height="118" rx="5" fill="url(#frostG)" stroke="#0F1A63" stroke-width="2.5"/>
      <g clip-path="url(#glassClip)">
        <g fill="#fff" opacity=".4">
          <circle cx="252" cy="172" r="10"/><circle cx="300" cy="166" r="13"/><circle cx="320" cy="206" r="10"/>
          <circle cx="258" cy="222" r="12"/><circle cx="298" cy="246" r="11"/><circle cx="248" cy="262" r="8"/>
        </g>
        <g id="shadow"><g transform="translate(285 0)" fill="#1A1E4C"><circle cx="0" cy="196" r="20"/><circle cx="0" cy="174" r="10"/><path d="M-40 280Q-36 220 0 218Q36 220 40 280Z"/></g></g>
      </g>
      <rect x="238" y="290" width="94" height="128" rx="5" fill="none" stroke="#0F1A63" stroke-width="3" opacity=".6"/>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const game=$('game'),overlay=$('overlay'),hideBtn=$('hideBtn');
  const TOTAL=90;
  const BGM={play:'Christmas Time Again.mp3',win:'A Magical Evening Begins.mp3'};
  const LINE='#2B2340';
  const HEART=on=>'<svg viewBox="0 0 24 24" class="'+(on?'':'off')+'" aria-hidden="true"><path d="M12 21C5 15.500 2 12.200 2 8.600 2 5.900 4.100 4 6.600 4c1.900 0 3.700 1 5.400 3 1.700-2 3.500-3 5.400-3C19.900 4 22 5.900 22 8.600 22 12.200 19 15.500 12 21Z" fill="#FF5A6E" stroke="'+LINE+'" stroke-width="2"/><path d="M6 8.500Q7 6.500 9 6.800" stroke="#fff" stroke-width="1.800" fill="none" stroke-linecap="round"/></svg>';
  const STAR=on=>'<svg viewBox="0 0 24 24" class="'+(on?'on':'')+'" aria-hidden="true"><path d="M12 2.500l2.900 6 6.500.8-4.800 4.500 1.200 6.500L12 17.100 6.200 20.300l1.200-6.500L2.600 9.300l6.500-.8Z" fill="'+(on?'#FFC83D':'#4A436E')+'" stroke="'+LINE+'" stroke-width="2" stroke-linejoin="round"/></svg>';
  const LEVELS=['평화','수상해','경계','감시 중'];

  let muted=false,ac=null,holding=false,last=0,G=fresh(),heartsKey='',bestKey='momHideBestV2';

  function fresh(){
    return {mode:'title',fun:0,lives:3,time:TOTAL,mom:'away',momT:0,real:true,warnLen:1,grace:0,next:1.8,
      caught:0,safe:0,streak:0,bestStreak:0,taps:0,readyT:0,recheck:false,note:'',noteT:0,score:0};
  }
  function loadBest(){try{return +localStorage.getItem(bestKey)||0}catch(e){return 0}}
  function saveBest(v){try{localStorage.setItem(bestKey,String(v))}catch(e){}}

  /* ---------- audio ---------- */
  const bgm=new Audio();bgm.loop=true;bgm.preload='auto';let track='';
  function playBgm(name){
    if(muted)return;
    try{
      if(track!==name){track=name;bgm.src=encodeURI(name)}
      const p=bgm.play();if(p&&p.catch)p.catch(()=>{});
    }catch(e){}
  }
  function stopBgm(){try{bgm.pause()}catch(e){}}
  function ctx(){
    if(muted)return null;
    if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
    if(ac.state==='suspended'&&ac.resume)ac.resume().catch(()=>{});
    return ac;
  }
  function tone(f1,f2,dur,type,vol,delay){
    const c=ctx();if(!c)return;
    const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f1,t);
    if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.03);
  }
  const sfx={
    tap(){tone(700+Math.random()*300,1300,.06,'triangle',.08)},
    hide(){tone(520,240,.08,'sine',.12)},
    unhide(){tone(260,520,.08,'sine',.07)},
    steps(len){const n=Math.max(2,Math.round(len/.22));for(let i=0;i<n;i++)tone(100,55,.09,'sine',.45,i*.22)},
    creak(){tone(240,110,.4,'sawtooth',.05)},
    door(){tone(150,80,.15,'square',.04)},
    caught(){tone(260,70,.5,'sawtooth',.1);tone(180,50,.6,'square',.07,.1)},
    safe(){tone(660,990,.1,'triangle',.08);tone(990,1320,.12,'triangle',.07,.09)},
    ready(){tone(440,440,.12,'square',.05)},
    go(){tone(880,880,.18,'square',.06)},
    win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.22,'triangle',.12,i*.12))}
  };

  /* ---------- UI helpers ---------- */
  const sndOn='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.500 8.500a5 5 0 0 1 0 7"/></svg>';
  const sndOff='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  $('snd').innerHTML=sndOn;
  $('snd').addEventListener('click',()=>{
    muted=!muted;$('snd').innerHTML=muted?sndOff:sndOn;
    if(muted)stopBgm();else if(G.mode==='play'||G.mode==='caught'||G.mode==='ready')playBgm(BGM.play);
  });

  function pop(text,x,y,cls){
    const el=document.createElement('div');el.className='pop'+(cls?' '+cls:'');el.textContent=text;
    el.style.left=x+'px';el.style.top=y+'px';game.appendChild(el);
    setTimeout(()=>el.remove(),850);
  }
  function banner(text,cls){
    const b=$('banner');b.textContent=text;b.className='banner'+(cls?' '+cls:'');
    void b.offsetWidth;b.classList.add('go');
  }
  function shake(){game.classList.remove('shake');void game.offsetWidth;game.classList.add('shake')}

  function setHide(v){
    if(v===holding)return;
    holding=v;hideBtn.classList.toggle('down',v);
    if(G.mode==='play'){v?sfx.hide():sfx.unhide()}
  }

  /* ---------- flow ---------- */
  function start(){
    G=fresh();G.mode='ready';G.readyT=1.3;overlay.hidden=true;heartsKey='';
    ctx();playBgm(BGM.play);banner('준비!');sfx.ready();
  }
  function caught(){
    G.lives--;G.fun=Math.max(0,G.fun-10);G.mode='caught';G.caught=2;G.streak=0;
    shake();sfx.caught();banner('들켰다!','bad');
    pop('재미 -10',game.clientWidth*.5,game.clientHeight*.55,'bad');
  }
  function end(kind){
    G.mode='over';
    let best=loadBest();
    const left=Math.round(G.time);
    if(kind==='win'){
      if(left>best){best=left;saveBest(left)}
      sfx.win();playBgm(BGM.win);
    }else{sfx.caught();stopBgm()}
    showEnd(kind,best,left);
  }
  function showEnd(kind,best,left){
    const win=kind==='win';
    const stars=win?G.lives:0;
    let title,msg;
    if(win){title='작전 성공!';msg='엄마는 공부만 한 줄 알아요. 들킨 횟수 '+(3-G.lives)+'번.'}
    else if(kind==='lives'){title='게임기 압수';msg='하트를 모두 잃었어요. 숙제부터 하래요.'}
    else{title='학원 갈 시간!';msg='재미가 '+Math.floor(G.fun)+'%에서 멈췄어요. 너무 오래 숨어 있었나 봐요.'}
    overlay.innerHTML='<div class="stars">'+STAR(stars>=1)+STAR(stars>=2)+STAR(stars>=3)+'</div>'+
      '<h1 class="logo '+(win?'good':'bad')+'" style="text-align:center;transform:none">'+title+'</h1>'+
      '<p class="sub" style="text-align:center">'+msg+'</p>'+
      '<div class="stats"><div class="panel">무사 통과<b>'+G.safe+'</b></div><div class="panel">최고 연속<b>'+G.bestStreak+'</b></div><div class="panel">'+(win?'남은 시간':'재미')+'<b>'+(win?left+'초':Math.floor(G.fun)+'%')+'</b></div></div>'+
      '<button class="cta" id="again" type="button">다시 하기</button>'+
      '<p class="best">최고 기록: '+(best?'남은 시간 '+best+'초':'아직 없음')+'</p>';
    overlay.hidden=false;$('again').addEventListener('click',start);
    setTimeout(()=>{const b=$('again');if(b)b.focus({preventScroll:true})},60);
  }
  function showTitle(){
    const best=loadBest();
    overlay.innerHTML='<h1 class="logo">엄마 몰래<br>게임</h1><span class="tag">숨바꼭질 대작전</span>'+
      '<div class="steps">'+
        '<div class="panel step"><svg viewBox="0 0 40 40"><rect x="5" y="9" width="30" height="21" rx="4" fill="#7E7AA6" stroke="#2B2340" stroke-width="2.5"/><rect x="9" y="13" width="22" height="13" rx="2" fill="#1B2A6B"/><circle cx="26" cy="31" r="5" fill="#F6CDA8" stroke="#2B2340" stroke-width="2.5"/></svg><em>1</em>태블릿 톡톡<br>재미 올리기</div>'+
        '<div class="panel step"><svg viewBox="0 0 40 40"><rect x="8" y="3" width="24" height="34" rx="2" fill="#2A47C4" stroke="#2B2340" stroke-width="2.5"/><rect x="12" y="7" width="16" height="13" rx="2" fill="#DCEBF4"/><circle cx="20" cy="12" r="3.500" fill="#1A1E4C" opacity=".7"/><path d="M15 20Q15 15 20 15Q25 15 25 20Z" fill="#1A1E4C" opacity=".7"/><rect x="27" y="22" width="3" height="6" rx="1.500" fill="#fff"/></svg><em>2</em>그림자와<br>덜컹 소리 주의</div>'+
        '<div class="panel step"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#FFC83D" stroke="#2B2340" stroke-width="2.5"/><path d="M10 15Q15 13 20 15.500Q25 13 30 15V27Q25 25 20 27.500Q15 25 10 27Z" fill="#fff" stroke="#2B2340" stroke-width="2" stroke-linejoin="round"/></svg><em>3</em>꾹 눌러서<br>책으로 숨기기</div>'+
      '</div>'+
      '<p class="sub">엄마가 문을 열었을 때 태블릿이 보이면 들켜요. 하트 3개, 90초 안에 재미 100%를 채우세요. 엄마는 갈수록 더 자주 오고, 가는 척하다 다시 오기도 해요.</p>'+
      '<button class="cta" id="go" type="button">게임 시작</button>'+
      '<p class="best">'+(best?'최고 기록: 남은 시간 '+best+'초':'오른쪽 아래 버튼을 꾹 누르는 동안만 숨어요')+'</p>';
    overlay.hidden=false;$('go').addEventListener('click',start);
  }

  /* ---------- update ---------- */
  function update(dt){
    if(G.mode==='ready'){
      G.readyT-=dt;
      if(G.readyT<=0){G.mode='play';banner('시작!','good');sfx.go()}
      return;
    }
    if(G.mode==='caught'){
      G.caught-=dt;
      if(G.caught<=0){
        if(G.lives<=0){end('lives');return}
        G.mode='play';G.mom='away';G.next=1.6;
      }
      return;
    }
    G.time-=dt;
    if(G.time<=0){G.time=0;end('time');return}
    const lvl=Math.min(3,Math.floor(G.fun/25));
    if(!holding){G.fun=Math.min(100,G.fun+2.3*dt);G.score+=dt*37}
    if(G.noteT>0)G.noteT-=dt;

    if(G.mom==='away'){
      G.next-=dt;
      if(G.next<=0){
        G.real=G.recheck?true:Math.random()>(0.22+lvl*0.05);
        G.warnLen=G.recheck?0.45:Math.max(.4,.85-lvl*.13);
        G.recheck=false;G.momT=G.warnLen;G.mom='warn';
        sfx.steps(G.warnLen);
      }
    }else if(G.mom==='warn'){
      G.momT-=dt;
      if(G.momT<=0){
        if(G.real){G.mom='here';G.momT=1.4+Math.random()*1.4;G.grace=Math.max(.28,.38-lvl*.03);sfx.creak()}
        else{G.mom='away';G.next=Math.max(.7,.9+Math.random()*1.5-lvl*.15);G.note='휴, 그냥 지나갔다';G.noteT=1.1}
      }
    }else if(G.mom==='here'){
      if(!holding){G.grace-=dt;if(G.grace<=0){caught();return}}
      G.momT-=dt;
      if(G.momT<=0){
        G.mom='away';G.safe++;G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);
        const bonus=Math.min(8,2+G.streak);
        G.fun=Math.min(100,G.fun+bonus);sfx.door();sfx.safe();
        banner(G.streak>1?'SAFE x'+G.streak:'SAFE!','good');
        pop('재미 +'+bonus,game.clientWidth*.5,game.clientHeight*.55,'good');
        if(lvl>=1&&Math.random()<0.25+lvl*0.05){G.recheck=true;G.next=.45;G.note='가는 척! 다시 온다';G.noteT=1.2}
        else G.next=Math.max(1,1.6+Math.random()*1.8-lvl*.35);
      }
    }
    if(G.fun>=100)end('win');
  }

  /* ---------- render ---------- */
  function setBubble(l1,l2){
    $('bt1').textContent=l1||'';$('bt2').textContent=l2||'';
    $('bt').setAttribute('y',l2?'244':'256');
    game.dataset.bubble=l1?'1':'0';
  }
  function render(){
    const live=G.mode==='play';
    const momHere=G.mode==='caught'||(live&&G.mom==='here');
    const hid=holding&&live;
    const d=game.dataset;
    d.mode=G.mode;d.mom=G.mode==='caught'?'here':G.mom;d.hide=hid?'1':'0';d.door=momHere?'1':'0';
    d.mood=G.mode==='caught'?'angry':(momHere?(holding?'calm':'sus'):'calm');
    d.face=G.mode==='caught'?'caught':(hid?'study':(live&&(G.mom==='warn'||G.mom==='here')?'alarm':'play'));
    d.alert=!live?'none':(G.mom==='here'&&!holding?'danger':(G.mom==='warn'?'warn':'none'));
    d.tap=(live&&G.taps<4&&!holding&&G.mom==='away')?'1':'0';

    if(G.mode==='caught')setBubble('게임기 압수!!','숙제부터 해!');
    else if(!live)setBubble('');
    else if(G.mom==='here')holding?setBubble('어머, 공부','열심히 하네~'):setBubble('너 지금','뭐 하니?!');
    else if(G.mom==='warn'&&live)setBubble('저벅… 저벅…');
    else setBubble('');

    if(G.mom==='warn'){
      const p=1-G.momT/G.warnLen;
      const x=G.real?90*(1-p):90-190*p;
      $('shadow').style.transform='translateX('+x.toFixed(1)+'px)';
    }

    const fun=Math.floor(G.fun);
    $('fun').style.width=G.fun+'%';$('funN').textContent=fun+'%';$('barA').setAttribute('aria-valuenow',fun);
    $('scoreTxt').textContent=String(Math.floor(G.score)).padStart(5,'0');
    const secs=Math.ceil(G.time);
    $('clock').textContent=secs;
    $('timer').style.setProperty('--p',(G.time/TOTAL).toFixed(3));
    $('timer').classList.toggle('low',secs<=15&&G.mode!=='title');
    const lvl=Math.min(3,Math.floor(G.fun/25));
    $('lvl').textContent='경계 Lv.'+(lvl+1)+' '+LEVELS[lvl];
    if(String(G.lives)!==heartsKey){
      heartsKey=String(G.lives);
      $('hearts').innerHTML=HEART(G.lives>=1)+HEART(G.lives>=2)+HEART(G.lives>=3);
    }

    let s='away',t='엄마는 부엌에 있어요';
    if(G.mode==='over'){t='게임 끝'}
    else if(G.mode==='caught'){s='here';t='들켰어요!'}
    else if(G.mom==='here'){s='here';t=holding?'엄마가 보고 있어요. 참아!':'엄마다! 빨리 숨겨!'}
    else if(G.mom==='warn'){s='warn';t='발소리가 다가와요!'}
    else if(G.noteT>0)t=G.note;
    else if(holding&&live)t='엄마 없는데 숨어 있어요';
    const r=$('radar');if(r.dataset.s!==s)r.dataset.s=s;
    const rt=$('radarT');if(rt.textContent!==t)rt.textContent=t;

    try{
      const target=muted?0:(hid?0.1:0.4);
      bgm.volume=Math.max(0,Math.min(1,bgm.volume+(target-bgm.volume)*0.2));
    }catch(e){}
  }

  function frame(now){
    const dt=Math.min(.05,(now-last)/1000||0);last=now;
    if(G.mode==='play'||G.mode==='caught'||G.mode==='ready')update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  hideBtn.addEventListener('pointerdown',e=>{e.preventDefault();try{hideBtn.setPointerCapture(e.pointerId)}catch(_){}setHide(true)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>hideBtn.addEventListener(t,()=>setHide(false)));
  hideBtn.addEventListener('contextmenu',e=>e.preventDefault());
  hideBtn.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')e.preventDefault()});
  const HIDE_KEYS=['Space','ArrowDown','KeyH'];
  window.addEventListener('keydown',e=>{
    if(!HIDE_KEYS.includes(e.code))return;
    if(G.mode==='play'||G.mode==='caught'||G.mode==='ready'){e.preventDefault();if(!e.repeat)setHide(true)}
  });
  window.addEventListener('keyup',e=>{if(HIDE_KEYS.includes(e.code))setHide(false)});
  window.addEventListener('blur',()=>setHide(false));
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){stopBgm();setHide(false)}
    else if(G.mode==='play'||G.mode==='caught'||G.mode==='ready')playBgm(BGM.play);
  });

  $('tabletHit').addEventListener('pointerdown',e=>{
    if(G.mode!=='play'||holding)return;
    G.fun=Math.min(100,G.fun+1);G.taps++;G.score+=50;sfx.tap();
    const r=game.getBoundingClientRect();
    pop('+1',e.clientX-r.left,e.clientY-r.top-14);
    const t=$('tablet');t.classList.remove('bump');void t.getBoundingClientRect();t.classList.add('bump');
  });

  showTitle();
  requestAnimationFrame(frame);
})();
</script>
